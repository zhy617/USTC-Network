# USTC 苏州校区网络准入配置示例
# 复制本文件为 ustc-network.local.conf 后填写真实账号密码。
# ustc-network.local.conf 已被 .gitignore 忽略，不会被提交。

# 第 1 行有效配置：网络准入账号，通常是手机号。不要加 {}。
13300000000

# 第 2 行有效配置：网页登录时输入的明文密码，不是抓包里的加密 pwd。
your_plaintext_password

# 第 3 行有效配置：检测间隔，单位秒。
60

# 第 4 行有效配置：外网检测主机，多个主机用逗号或空格分隔。
223.5.5.5,1.1.1.1

# 第 5 行有效配置：心跳日志间隔。
# 10 表示每 10 次检测输出一次 still online；1 表示每次检测都输出；0 表示只在状态变化时输出。
10
